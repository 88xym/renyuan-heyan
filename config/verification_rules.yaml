# ============================================================
# 人员入场资料核验标准规则 v2.0
# ============================================================
# 三类人员（澳门本地人 / 特别逗留证 / 外地雇员蓝卡）的
# 资料要求、检查项、宽松策略与合同逻辑。
#
# 配套文件：
#   check_policy.yaml    手写体宽松策略（签名看不清算OK、0/O不区分等）
#   organization.yaml    分包层级（总包中国港湾 → 一包 → 二包）
#
# 校验总原则：
#   1. 手写的位置不重要，主要看打印内容；手写体宽松识别（见 check_policy）
#   2. 所有"与证件复印件一致"的检查，均以本 PDF 内的证件扫描页为基准
#   3. 图片"清晰可认"为人工核验项（程序只能做存在性检查）
# ============================================================

version: "2.0"
updated: "2026-09-07"

# ============================================================
# 一、三类人员资料清单
# ============================================================
person_types:
  macau_resident:
    name: "澳门本地人"
    key_doc: "澳门身份证"
    # 所需资料清单；required=true 为必附
    docs:
      - key: personal_info_page
        name: "申请人个人资料页"
        required: true
      - key: applicant_declaration
        name: "申请人声明"
        required: true
      - key: contractor_declaration
        name: "承判商声明"
        required: true
      - key: contract_page
        name: "合同页"
        required: false          # 条件性：见 contract_logic（直属免附，二判/三判必附）
      - key: id_copy_page
        name: "证件复印件页"
        required: true
      - key: id_authenticity_record
        name: "身份证真伪记录"
        required: true           # 澳门身份证人员必附真伪记录
    # 个人资料页中间框内需附的照片
    photos_required:
      - "澳门身份证"
      - "建筑业职安卡（职安卡）"
    # 证件页需附的证件
    id_pages_required:
      - "澳门身份证"
      - "建筑业职安卡（职安卡）"

  special_stay:
    name: "特别逗留证人士"
    key_doc: "特别逗留证"
    docs:
      - key: personal_info_page
        name: "申请人个人资料页"
        required: true
      - key: applicant_declaration
        name: "申请人声明"
        required: true
      - key: contractor_declaration
        name: "承判商声明"
        required: true
      - key: contract_page
        name: "合同页"
        required: false          # 条件性：见 contract_logic
      - key: id_copy_page
        name: "证件复印件页（1-2张）"
        required: true
    # 特别逗留证人员无身份证真伪记录要求
    photos_required:
      - "特别逗留证"
      - "建筑业职安卡（职安卡）"
    id_pages_required:
      - "往来港澳通行证"
      - "建筑业职安卡（职安卡）"
      - "特别逗留证"

  blue_card:
    name: "外地雇员身份识别证（蓝卡）"
    key_doc: "外地雇员身份识别证（蓝卡）"
    docs:
      - key: personal_info_page
        name: "申请人个人资料页"
        required: true
      - key: applicant_declaration
        name: "申请人声明"
        required: true
      - key: contractor_declaration
        name: "承判商声明"
        required: true
      - key: contract_page
        name: "合同页"
        required: false          # 条件性：见 contract_logic
      - key: id_copy_page
        name: "证件复印件页"
        required: true
      - key: labor_docs
        name: "劳工文件（申请信函/批示/逗留许可申请表）"
        required: true
    # 蓝卡人员无身份证真伪记录要求
    photos_required:
      - "外地雇员身份识别证（蓝卡）"
      - "建筑业职安卡（职安卡）"
    id_pages_required:
      - "往来港澳通行证"
      - "建筑业职安卡（职安卡）"
      - "外地雇员身份识别证（蓝卡）"
    # 蓝卡特殊情况：蓝卡未颁发时，以行街纸+红印纸替代
    blue_card_special:
      enabled: true
      description: >
        蓝卡未颁发时，治安警察局会发收据（俗称行街纸）和带二维码纸条（俗称红印纸），
        行街纸+红印纸具有同等法律意义。
      rules:
        - 行街纸 + 红印纸可替代蓝卡，身份证副本位置可空缺
        - 证件页需附：往来港澳通行证、职安卡、行街纸+红印纸
    # 蓝卡人员需核验的劳工三表（内容需互相对应）
    labor_docs_check:
      docs:
        - "劳工事务局外地雇员申请信函"
        - "劳工局批示"
        - "治安警察局“雇员身份的逗留许可”申请表"
      consistency_required: true
      consistency_message: "三份表格中的姓名、证件号码、公司、日期需互相对应，证明该人员合法"

# ============================================================
# 二、申请人个人资料页检查项（三类人员共用）
# ============================================================
personal_info_page_check:
  # 需与证件扫描件逐项核对一致的信息
  fields_match_id_copy:
    - name: "中文姓名"
      check: "与证件复印件一致"
    - name: "英文姓名"
      check: "与证件复印件一致"
    - name: "日期"
      check: "与证件复印件一致"
    - name: "承判公司"
      check: "与证件复印件/申报一致"
    - name: "承判工程项目"
      check: "填写准确"
    - name: "职安卡资料"
      check: "编号、有效期与证件复印件一致"
  # 照片要求
  photo_check:
    - 中间框内附照片（对应人员类型的证件 + 建筑业职安卡）
    - 图片需清晰可认（人工核验项）

# ============================================================
# 三、申请人声明检查项（三类人员共用）
# ============================================================
applicant_declaration_check:
  fields:
    - name: "姓名"
      required: true
      check: "填写正确"
    - name: "单位"
      required: true
      check: "填写正确"
    - name: "证件号码"
      required: true
      check: "填写正确"
    - name: "签名"
      required: true
      policy: "宽松识别——只要签名即可，看不清视为已签署"
    - name: "签署日期"
      required: true
      policy: "宽松识别——手写日期格式异常不直接判错，但完全空白判缺失"

# ============================================================
# 四、承判商声明检查项（三类人员共用）
# ============================================================
contractor_declaration_check:
  part1: "第一大项：一包单位名称"
  part2: "第二大项：甲乙丙用于区分二判、三判、四判等"
  signature_seal:
    - "承判商负责人签字"
    - "承判商盖章"
  # 合同页供给逻辑
  contract_logic:
    # 承判商声明中出现的单位，与第一页承判公司名称比对：
    # - 若出现其他单位 → 该单位是第一页承判公司的二判或三判
    #   → 需补充：二判与三判之间合同、二判与一判之间合同
    # - 若无其他单位 → 与总包（中国港湾）直属承判关系 → 无需提供合同
    rule: |
      若承判商声明中填写的单位与第一页承判公司名称不一致：
        说明该单位是第一页承判公司的二判或三判，
        需补充【二判与三判之间合同】+【二判与一判之间合同】。
      若本页没有其他单位：
        说明与总包（中国港湾）是直属承判关系，无需提供合同。
    required_contracts_when_mismatch:
      - "二判与三判之间合同"
      - "二判与一判之间合同"
    contract_free_when_direct: "直属总包（中国港湾）关系，免附合同"

# ============================================================
# 五、证件页检查项（三类人员共用）
# ============================================================
id_copy_page_check:
  - "该页附上人员证件，与第一页（个人资料页）证件应当一致"
  - "各类人员的证件清单见 person_types.*.id_pages_required"

# ============================================================
# 六、身份证真伪记录
# ============================================================
id_authenticity_check:
  # 仅澳门身份证人员需要
  applies_to: ["macau_resident"]
  rule: "持澳门身份证人员须提供身份证真伪记录，其余证件无须提供"

# ============================================================
# 七、承判公司命名规则（一包名称）
# ============================================================
company_naming:
  general_contractor: "中国港湾工程有限责任公司"
  level1: "一包单位名称"   # 当前一包：中交天航南方交通建设有限公司
