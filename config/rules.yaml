# 人员核验 PDF 校验规则
#
# 说明：
# - fields：需要检查的字段。程序会在 PDF 打印文本中搜索 label（标签），
#   然后按 locate 方式取值：
#     right = 标签同行右侧（默认，兼容“姓名：张三”和表格“标签|值”布局）
#     below = 标签下一行
# - rules：该字段的校验规则，type 支持：
#     regex    正则完整匹配（pattern）
#     in_set   取值必须属于集合（values）
#     date     合法日期（支持 YYYY-MM-DD / YYYYMMDD / YYYY年MM月DD日）
#     id_card  中国大陆18位身份证号（出生日期+校验位）
# - required: true 表示必填，缺失即判不通过
# - cross_checks：跨字段一致性检查
#     id_birth_match   身份证出生日期 == 出生日期字段
#     id_gender_match  身份证第17位推断性别 == 性别字段
#
# 【重要】以下字段与规则为“示例”，请根据你实际的表单（标签文字、
# 字段清单）在拿到真实 PDF 后替换定制。

fields:
  - label: "姓名"
    alias: "name"
    required: true
    locate: "right"
    rules:
      - type: "regex"
        pattern: "^[\\u4e00-\\u9fa5·]{2,20}$"
        message: "姓名应为2-20个汉字"

  - label: "身份证号"
    alias: "id_card"
    required: true
    locate: "right"
    rules:
      - type: "id_card"
        message: "身份证号不合法（位数/出生日期/校验位）"

  - label: "性别"
    alias: "gender"
    required: true
    locate: "right"
    rules:
      - type: "in_set"
        values: ["男", "女"]
        message: "性别只能填写男或女"

  - label: "联系电话"
    alias: "phone"
    required: false
    locate: "right"
    rules:
      - type: "regex"
        pattern: "^1[3-9]\\d{9}$"
        message: "手机号应为11位且以1开头"

  - label: "出生日期"
    alias: "birth_date"
    required: true
    locate: "right"
    rules:
      - type: "date"
        message: "出生日期格式不正确（应为 YYYY-MM-DD 等）"

cross_checks:
  - name: "身份证出生日期与出生日期字段一致性"
    type: "id_birth_match"
    id_field: "id_card"
    birth_field: "birth_date"
    message: "身份证号中的出生日期与“出生日期”字段不一致"

  - name: "身份证性别与性别字段一致性"
    type: "id_gender_match"
    id_field: "id_card"
    gender_field: "gender"
    message: "身份证号推断性别与“性别”字段不一致"
