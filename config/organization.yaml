# 项目分包层级与雇佣关系校验规则
#
# 本项目的分包层级链（从上游到下游）：
#   总包 → 一包 → 二包 → ...
#
# 雇佣关系说明：
#   申请人声明中的"受雇于"公司，与承判商声明中的实际雇主公司
#   可以不同，只要二者都在本分包层级链中、且层级关系合理，
#   即视为正常，不判为"雇佣主体不一致"。
#
# 例如：申请人声明写"受雇于中交天航（一包）"，
#       承判商声明丙项写"乃二判富華國際之直接雇员"，
#       二者符合 一包→二包 层级，属正常。

hierarchy:
  - level: 总包
    name: 中国港湾工程有限责任公司
    alias: [CHEC, 中国港湾]
  - level: 一包
    name: 中交天航南方交通建设有限公司
    alias: [中交天航]
  - level: 二包
    name: 富华国际（澳门）工程有限公司
    alias: [富华国际, 富華國際, 富华]

# OCR 错别字修正：OCR 识别到的公司名 → 实际公司名（用于"承判公司名称"字段）
# 仅修正稳定复现的 OCR 错误；识别不到可信公司名时，报告文件名会回退 hierarchy 一包别名
ocr_fix:
  埃纺: 大建築

# 校验规则
employment_relation:
  # 申请人声明"受雇于"与承判商声明实际雇主不同时：
  allow_different_employer: true
  # 只要两家公司都在 hierarchy 中即视为正常
  require_both_in_hierarchy: true
  # 不强制要求层级顺序（一包的人可以被二包直接雇佣等）
  strict_level_order: false
